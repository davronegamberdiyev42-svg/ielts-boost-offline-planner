idth:100%;height:auto;color:var(--mut)}\ndetails{margin:12px 0}summary{cursor:pointer;font-weight:600;padding:6px 0}details ul{margin:6px 0;padding-left:20px}\n#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90%;z-index:5}\n#toast[hidden]{display:none}\n#toast button{margin-left:8px;padding:4px 10px;background:var(--bg);color:var(--ink)}\n.row2{display:flex;gap:8px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}\n.ch2{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:14px}\nbutton:disabled{opacity:.7;cursor:default}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}\nnav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);font-size:13px;padding:14px 2px}\nnav button[aria-current=true]{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}\n<\/style>\n<\/head>\n<body>\n<header><h1>IELTS Reading trener<\/h1><p id=\"sub\" class=\"mut\">Maqsad: 30+/40 (band 7.0). 12 hafta, kuniga 100 daqiqa. Oflayn nusxa: internet kerak emas.<\/p><p id=\"bd\" class=\"mut\" style=\"margin:2px 0 0;font-size:13px\"><\/p><\/header>\n<main id=\"app\"><\/main>\n<div id=\"toast\" role=\"status\" hidden><\/div>\n<nav>\n<button data-tab=\"plan\">Reja<\/button>\n<button data-tab=\"pp\">Paraphrase<\/button>\n<button data-tab=\"err\">Xatolar<\/button>\n<button data-tab=\"ctl\">Nazorat<\/button>\n<\/nav>\n<script>\nconst K='ieltsReadingTrener',$=s=>document.querySelector(s);\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];\nconst WD=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','J ods','Konkret-umumiy','Matching info'],['despite the high cost','although it was expensive','Gap tuzilishi','MCQ']];\nconst uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);\nconst fresh=()=>({pp:SEED.map(r=>({id:uid(),a:r[0],b:r[1],t:r[2],q:r[3],m:0,bx:0,due:today()})),err:[],log:{},done:{},start:''});\nconst patch=p=>{p.log=p.log||{};p.done=p.done||{};p.start=p.start||'';p.pp.forEach(r=>{if(!r.id)r.id=uid();if(r.bx===undefined)r.bx=0;if(!r.due)r.due=today()});return p};\nlet canSave=true;try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){canSave=false}\nlet S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}\nS=(S&&Array.isArray(S.pp)&&Array.isArray(S.err))?patch(S):fresh();\nlet lsOk=canSave,idbOk=false,persisted=null,idb=null,lastSnapDay='',st=0,pendingSave=false;\nlet cloud=null,cloudErr='',cloudDirty=false,cloudBusy=false,cloudT=0;\nconst SNK=K+'_snaps';\nconst getSnaps=()=>{try{return JSON.parse(localStorage.getItem(SNK))||[]}catch(e){return[]}};\nfunction snap(r){try{const a=getSnaps();a.unshift({t:Date.now(),r,d:JSON.stringify(S)});while(a.length>8)a.pop();localStorage.setItem(SNK,JSON.stringify(a))}catch(e){}}\nfunction snapDaily(){if(lastSnapDay!==today()){snap('Kunlik nusxa');lastSnapDay=today()}}\nfunction writeLocal(){try{localStorage.setItem(K,JSON.stringify(S));lsOk=true}catch(e){lsOk=false}}\nfunction idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('ieltsReading',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}\nfunction idbGet(){return new Promise(res=>{try{const q=idb.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}\nfunction idbPut(){try{if(!idb)return;idb.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(S),'state');idbOk=true}catch(e){idbOk=false}}\nfunction pushCloud(){if(!cloud)return; xt-anchor=\"end\" font-size=\"10\" fill=\"currentColor\">${v}<\/text>`});\n [28,56,84].forEach(n=>{g+=`<text x=\"${X(n)}\" y=\"156\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">${n/7}-h.<\/text>`});\n g+=`<polyline points=\"${X(0)},${Y(19)} ${X(28)},${Y(23)} ${X(56)},${Y(27)} ${X(84)},${Y(30)}\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>`;\n if(m.length>1)g+=`<polyline points=\"${m.map(x=>X(Math.min(x.n,84))+','+Y(x.sc)).join(' ')}\" fill=\"none\" style=\"stroke:var(--ac)\" stroke-width=\"2\"/>`;\n m.forEach(x=>{g+=`<circle cx=\"${X(Math.min(x.n,84))}\" cy=\"${Y(x.sc)}\" r=\"4\" style=\"fill:var(--ac)\"/>`});\n return `<svg viewBox=\"0 0 320 162\" role=\"img\" aria-label=\"Mock natijalari va maqsad chizig'i\">${g}<\/svg>`;\n}\n\nfunction vCtl(){\n let h='';\n if(S.start){\n  const s=stats(),[cur,best]=streaks(),acc=s.tt?Math.round(s.ok/s.tt*100)+'%':'-',bm=s.mocks.length?Math.max(...s.mocks.map(x=>x.sc)):null;\n  h+=`<div class=st><div><b>${(s.dm/60).toFixed(1)} soat<\/b><span>Bajarilgan, reja: ${Math.round(s.tot/60)} soat<\/span><\/div><div><b>${cur} kun<\/b><span>Ketma-ket, eng uzun: ${best}<\/span><\/div><div><b>${acc}<\/b><span>Passage aniqligi<\/span><\/div><div><b>${bm===null?'-':bm+'/40'}<\/b><span>${bm===null?`Mock yo'q`:'Eng yaxshi mock, Band '+band(bm)}<\/span><\/div><\/div>`;\n  let cells='';\n  for(let n=1;n<=84;n++){const k=addD(S.start,n-1),d=dayStat(k),p=d.tot?d.dm/d.tot:0,fut=diff(k,today())>0,cl=fut?'h0':p>=1?'h3':p>=.5?'h2':p>0?'h1':'h0';cells+=`<button data-day=\"${k}\" class=\"hm ${cl}${d.bl.some(b=>b.id==='m')?' mk':''}${k===sel?' sl':''}\" aria-label=\"${n}-kun\">${n}<\/button>`}\n  h+=`<div class=card><h2>84 kunlik jadval<\/h2><p class=mut>Har katak bir kun, har qator bir hafta. To'q rang to'liq bajarilgan kun. Yashil pastki chiziq mock kunini bildiradi. Katakni bossangiz, o'sha kun ochiladi.<\/p><div class=hmg>${cells}<\/div><\/div>`;\n  h+=`<div class=card><h2>Haftalik bajarilish<\/h2><div class=wbs>${s.wk.map((x,i)=>`<div class=wb title=\"${i+1}-hafta\"><i style=\"height:${Math.round((x.t?x.d/x.t:0)*66)+2}px\"><\/i>${i+1}<\/div>`).join('')}<\/div><p class=mut>Ustun balandligi shu haftada bajarilgan daqiqalar ulushi.<\/p><\/div>`;\n  h+=`<div class=card><h2>Mock natijalari<\/h2>${chart(s.mocks)}<p class=mut>Nuqtalar sizning mocklaringiz, yashil chiziq maqsad (4-hafta 23, 8-hafta 27, 12-hafta 30).<\/p>${s.mocks.length?s.mocks.slice().reverse().map(x=>`<p style=\"margin:6px 0\">${lab(x.k)} (${x.n}-kun): <b>${x.sc}/40<\/b>, Band ${band(x.sc)}${x.p.some(v=>v)?`, vaqt: ${x.p.map(v=>v||'-').join('/')} daq.`:''}<\/p>`).join(''):`<p class=mut>Mock natijasini mock kunining sahifasiga yozing (Reja bo'limi).<\/p>`}<\/div>`;\n } else h+=`<div class=card><p>Avval Reja bo'limida boshlanish sanasini tanlang.<\/p><\/div>`;\n h+=vSave();\n h+=`<div class=card><h2>Sozlamalar<\/h2><label>Boshlanish sanasi<input type=date data-set=start value=\"${esc(S.start)}\"><\/label><\/div>`;\n h+=`<div class=card><h2>Zaxira<\/h2><p class=\"${bagBad()?'bad':'mut'}\">${backupText()} Zaxirani haftada kamida bir marta oling va telefon xotirasidan tashqari joyga ham (Telegram Saved Messages, pochta) joylang.<\/p><div class=row><button class=pri data-act=exp>Faylga yuklab olish<\/button><button data-act=cp>Nusxalash<\/button><\/div>`\n +(bk?`<label>Zaxira matni. Belgilab nusxalang yoki boshqa zaxirani shu yerga joylab tiklang.<textarea id=bkt rows=6>${esc(JSON.stringify(S))}<\/textarea><\/label><button data-act=imptxt>Shu matndan tiklash<\/button>`:`<button class=lnk data-act=bk>Matn ko'rinishida ochish<\/button>`)\n +`<label>Fayldan tiklash<input type=file id=imp accept=\".json,application/json\"><\/label>`\n +(rs?`<p class=bad>Hamma ma'lumot o'chiriladi.<\/p><div class=row><button class=pri data-act=reset2>Ha, o'chirish<\/button><button data-act=rs0>Bekor qilish<\/button><\/div>`:`<button class=lnk data-act=reset>Hamma ma'lumotni o'chirish<\/button>`)+`<\/div>`;\n return h;\n}\n\nasync function exp(){\n const data=JSON.stringify(S,null,1),fn='ielts-reading-zaxira.json';\n try{let d=null;try{d=(window.claude&&claude.use)?await claude.use('downloads'):null}catch(e){}\n  if(d)await d.save({filename:fn,data});\n  else{const b=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}\n  S.lastBackup=Date.now();save();render();say(`Zaxira fayli tayyor. Yuklanmasa, \"Matn ko'rinishida ochish\" dan foydalaning.`)\n }catch(e){bk=true;render();say(`Yuklab bo'lmadi yoki bekor qilindi. Matnni nusxalab saqlang.`)}}\nfunction load(str){try{const p=JSON.parse(str);if(!Array.isArray(p.pp)||!Array.isArray(p.err))throw 0;snap('Tiklashdan oldingi holat');S=patch(p);save();say('Zaxira tiklandi');render()}catch(x){say(`Matn mos kelmadi. Shu ilovadan olingan zaxirani joylang.`)}}\n\nfunction render(){\n const warn=(lsOk||idbOk||cloud)?'':`<div class=\"card bad\">Brauzer ma'lumotni saqlay olmayapti. Nazorat bo'limidan zaxirani muntazam oling.<\/div>`;\n const bn=(tab==='plan'&&needBackup())?`<div class=\"card warn\"><b>Zaxira vaqti keldi.<\/b> ${backupText()} Ma'lumotingiz faqat shu brauzerda turibdi. <button class=pri data-act=exp style=\"margin-top:8px\">Zaxira olish<\/button><\/div>`:'';\n $('#app').innerHTML=warn+bn+({plan:vPlan,pp:vPP,err:vErr,ctl:vCtl})[tab]();updBadge();\n document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));\n}\n\nconst app=$('#app');\napp.addEventListener('click',e=>{\n const h=e.target.closest('[data-day]');if(h){sel=h.dataset.day;tab='plan';render();window.scrollTo(0,0);return}\n const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;\n if(a==='begin'){const v=$('#sd').value;if(!v){say('Sanani tanlang');return}S.start=v;sel=today()<v?v:today()}\n else if(a==='prev')sel=addD(sel,-1);\n else if(a==='next')sel=addD(sel
